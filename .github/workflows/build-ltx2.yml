# Capscify — GitHub Actions: ltx2 worker image build.
#
# Replaces .gitlab-ci.yml (GitLab CI is blocked on this project:
# identity verification is required to run CI jobs).
#
# NOTE: this image is large (CUDA base + torch + LTX pipelines, roughly
# 10-20GB). First builds can take 20-40 minutes — that is expected,
# not a failure. The model weights are NOT in the image; they come
# from the attached RunPod network volume at runtime.
#
# Image lands at ghcr.io/smartglaxx/ltx2:<sha> and :latest.
# (Owner lowercased on purpose: registry names must be lowercase,
# and github.repository_owner here is "SmartGlaxx" — using it raw
# makes buildx reject the tag. That was the first build's failure.)
# RunPod endpoints use the :latest tag (pin to a sha later if needed).

name: Build ltx2 worker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ltx2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Disk: stock runner has ~13GB free; the CUDA devel base (~15GB+)
      # plus torch + LTX deps need 30GB+. Run 40392667110 died unpacking
      # the base image; after freeing 17GB (30GB free) run 40412266458
      # got to the LTX pip install and died again. So free aggressively:
      # hostedtoolcache is safe to remove here — this workflow uses no
      # setup-* actions, and the docker actions run on the runner's
      # bundled node, not the tool cache.
      - name: Free disk space for the large CUDA image
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache /usr/local/julia /opt/az
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ltx2 image
        uses: docker/build-push-action@v6
        with:
          context: runpod-deploy/ltx2
          file: runpod-deploy/ltx2/Dockerfile
          push: true
          tags: |
            ghcr.io/smartglaxx/ltx2:${{ github.sha }}
            ghcr.io/smartglaxx/ltx2:latest
